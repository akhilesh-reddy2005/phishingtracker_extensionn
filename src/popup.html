<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Tracker</title>
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
    <div class="bg-shape bg-shape-left"></div>
    <div class="bg-shape bg-shape-right"></div>

    <div class="container">
        <div class="header">
            <div class="header-top">
                <h1>Phishing Tracker</h1>
                <div class="badge">LIVE</div>
            </div>
            <p>Security cockpit for the active tab</p>
        </div>

        <div class="status-section">
            <div id="status-card" class="status-card loading">
                <div class="spinner"></div>
                <p class="status-loading-text">Scanning current website...</p>
            </div>
        </div>

        <div class="details-section">
            <h3>Target URL</h3>
            <div id="details-container">
                <p id="current-url" class="url-text">-</p>
                <p id="threat-level" class="threat-level">-</p>
            </div>
        </div>

        <div class="actions">
            <button id="refresh-btn" class="btn btn-primary">Scan</button>
            <button id="report-btn" class="btn btn-secondary">Report Threat</button>
        </div>

        <button id="history-btn" class="btn btn-history">Threat Timeline</button>

        <div class="footer">
            <p>Powered by Safe Browsing and heuristics</p>
        </div>
    </div>
    <script src="../dist/popup.js"></script>
</body>
</html>
